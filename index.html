<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100vh;
            border: 0;
        }
    </style>
</head>

<body>

    <!-- Yahan a.com ka exact page URL lagao -->
    <iframe
        src="https://whoer.com"
        title="Embedded Website">
    </iframe>

</body>
</html>
