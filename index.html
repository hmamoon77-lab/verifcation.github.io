<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .black-box {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 800px;
            height: 100px;
            background: #000;
            z-index: 999999;
        }
    </style>
</head>

<body>

    <div class="page">

        <iframe
            src="https://whoer.com">
        </iframe>

        <div class="black-box"></div>

    </div>

</body>
</html>
