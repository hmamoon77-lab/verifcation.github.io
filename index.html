<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .black-box {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 161px;
            height: 28px;
            background: black;
            z-index: 999999;
        }

        .my-text {
            position: absolute;
            top: 100px;
            left: 50px;
            z-index: 999999;
            font-size: 20px;
            font-family: Arial, sans-serif;
            color: black;
            background: white;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <div class="page">

        <iframe src="https://whoer.com"></iframe>

        <!-- Black rectangle -->
        <div class="black-box"></div>

        <!-- Separate text -->
        <div class="my-text">
            My Custom Text
        </div>

    </div>

</body>
</html>
