<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .black-box {
            position: absolute;

            /* rectangle ki position */
            top: 20px;
            left: 20px;

            /* rectangle ka size */
            width: 161px;
            height: 28px;

            background: black;
            z-index: 10;
        }
    </style>
</head>

<body>

<div class="page">

    <iframe
        src="https://whoer.com">
    </iframe>

    <div class="black-box"></div>

</div>

</body>
</html>
